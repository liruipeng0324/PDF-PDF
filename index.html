<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#x53cc;&#x5c42; PDF &#x5236;&#x4f5c;&#x5de5;&#x5177;</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="&#x53cc;&#x5c42; PDF &#x5236;&#x4f5c;&#x5de5;&#x5177;">
        <header class="topbar">
          <div>
            <h1>&#x53cc;&#x5c42; PDF &#x5236;&#x4f5c;&#x5de5;&#x5177;</h1>
            <p>&#x9009;&#x62e9; Word&#x3001;&#x5e26;&#x4e66;&#x7b7e; PDF &#x6216;&#x591a;&#x4e2a;&#x6587;&#x4ef6;&#xff0c;&#x751f;&#x6210;&#x56fe;&#x7247;&#x7248;&#x5e76;&#x4fdd;&#x7559;&#x4e66;&#x7b7e;&#x7684;&#x6700;&#x7ec8; PDF&#x3002;</p>
          </div>
          <button class="icon-button" id="refreshTools" title="&#x5237;&#x65b0;&#x4f9d;&#x8d56;&#x68c0;&#x6d4b;" aria-label="&#x5237;&#x65b0;&#x4f9d;&#x8d56;&#x68c0;&#x6d4b;">&#x21bb;</button>
        </header>

        <div class="tool-checks" id="toolChecks" aria-live="polite"></div>

        <div class="grid">
          <form class="panel" id="toolForm">
            <label>
              <span>&#x6a21;&#x5f0f;</span>
              <select id="mode" name="mode">
                <option value="single">&#x5355;&#x4e2a;&#x6587;&#x4ef6;</option>
                <option value="queue-dir">&#x591a;&#x6587;&#x4ef6;&#x961f;&#x5217;</option>
                <option value="queue-csv">CSV &#x961f;&#x5217;</option>
              </select>
            </label>

            <label>
              <span>&#x8f93;&#x5165;&#x7c7b;&#x578b;</span>
              <select id="inputType" name="inputType">
                <option value="word" selected>Word &#x6587;&#x6863;</option>
                <option value="pdf">&#x5df2;&#x5bfc;&#x51fa;&#x7684;&#x5e26;&#x4e66;&#x7b7e; PDF</option>
              </select>
            </label>

            <div class="picker-row">
              <label>
                <span id="sourceLabel">&#x8f93;&#x5165;&#x6587;&#x4ef6;</span>
                <input id="sourcePath" name="sourcePath" type="text" readonly placeholder="&#x70b9;&#x51fb;&#x9009;&#x62e9;&#x8f93;&#x5165;">
              </label>
              <button type="button" id="pickSource">&#x9009;&#x62e9;&#x6587;&#x4ef6;</button>
            </div>

            <div class="picker-row">
              <label>
                <span id="outputLabel">&#x8f93;&#x51fa;&#x6587;&#x4ef6;&#x5939;</span>
                <input id="outputPath" name="outputPath" type="text" readonly placeholder="&#x70b9;&#x51fb;&#x9009;&#x62e9;&#x8f93;&#x51fa;&#x76ee;&#x5f55;">
              </label>
              <button type="button" id="pickOutput">&#x9009;&#x62e9;&#x76ee;&#x5f55;</button>
            </div>

            <label hidden>
              <span>&#x56fe;&#x7247;&#x5206;&#x8fa8;&#x7387;</span>
              <select id="dpi" name="dpi">
                <option value="300">300 DPI</option>
                <option value="400">400 DPI</option>
              </select>
            </label>

            <div class="toggles compact-options" aria-label="&#x5904;&#x7406;&#x9009;&#x9879;">
              <label hidden><input id="optimize" type="checkbox" checked> &#x538b;&#x7f29;&#x4f18;&#x5316;</label>
              <label><input id="acrobatDoubleLayer" type="checkbox"> Acrobat &#x53cc;&#x5c42;PDF</label>
              <label hidden><input id="keepWork" type="checkbox"> &#x4fdd;&#x7559;&#x4e2d;&#x95f4;&#x6587;&#x4ef6;</label>
              <label hidden><input id="detailedPngProgress" type="checkbox"> &#x663e;&#x793a;&#x56fe;&#x7247;&#x6bcf;&#x9875;&#x8fdb;&#x5ea6;</label>
              <label><input id="recurse" type="checkbox"> &#x5305;&#x542b;&#x5b50;&#x6587;&#x4ef6;&#x5939;</label>
              <label><input id="skipExisting" type="checkbox" checked> &#x8df3;&#x8fc7;&#x5df2;&#x5b58;&#x5728;&#x8f93;&#x51fa;</label>
            </div>

            <button class="primary-action" type="button" id="startJob">&#x5f00;&#x59cb;&#x5236;&#x4f5c;</button>
            <div class="queue-actions">
              <button class="secondary-action" type="button" id="pauseJob" disabled>&#x6682;&#x505c;&#x961f;&#x5217;</button>
              <button class="secondary-action" type="button" id="resumeJob" disabled>&#x7ee7;&#x7eed;&#x961f;&#x5217;</button>
              <button class="secondary-action" type="button" id="skipJob" disabled>&#x8df3;&#x8fc7;&#x4e0b;&#x4e00;&#x9879;</button>
            </div>
            <button class="secondary-action danger" type="button" id="cancelJob" disabled>&#x53d6;&#x6d88;&#x4efb;&#x52a1;</button>
            <button class="secondary-action" type="button" id="cleanCache">&#x6e05;&#x7406;&#x7f13;&#x5b58;</button>
            <button class="secondary-action" type="button" id="showRecent">&#x67e5;&#x770b;&#x6700;&#x8fd1;&#x8f93;&#x51fa;</button>
          </form>

          <aside class="panel status">
            <h2>&#x4efb;&#x52a1;&#x72b6;&#x6001;</h2>
            <p id="jobState">&#x7b49;&#x5f85;&#x5f00;&#x59cb;&#x3002;</p>
            <div class="progress-wrap" aria-label="&#x4efb;&#x52a1;&#x8fdb;&#x5ea6;">
              <div class="progress-meta">
                <span id="progressText">&#x5c1a;&#x672a;&#x5f00;&#x59cb;</span>
                <span id="progressPercent">0%</span>
              </div>
              <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
              </div>
            </div>
            <div class="result-actions" id="resultActions" hidden>
              <button type="button" id="openOutput">&#x6253;&#x5f00;&#x8f93;&#x51fa;&#x4f4d;&#x7f6e;</button>
              <button type="button" id="openLogDir">&#x6253;&#x5f00;&#x65e5;&#x5fd7;&#x76ee;&#x5f55;</button>
            </div>
            <div class="friendly-error" id="friendlyError" hidden></div>
            <pre id="logBox" aria-live="polite"></pre>
          </aside>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260702-output-cache-1"></script>
  </body>
</html>
